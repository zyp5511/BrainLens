[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "brainlens"
version = "1.0.0"
description = "AI co-review for EEG — from scalp EEG to SEEG: evidence-grounded EEG/iEEG/SEEG neurophysiology workbench, Clinical Triad verifier, MDT slide exporter, and MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
keywords = ["seeg", "ieeg", "eeg", "hfo", "epilepsy", "neurophysiology", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "anyio>=4.5,<5",
    "edfio>=0.4,<1",
    "filelock>=3.15,<4",
    "matplotlib>=3.8,<4",
    "mcp>=1.30,<2",
    "mne>=1.7,<2",
    "numpy>=1.26,<3",
    "pydantic>=2.8,<3",
    "python-pptx>=1.0,<2",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
pyhfo = ["pyhfo>=4,<5"]
micromed = ["neo>=0.14,<1"]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
brainlens = "brainlens.cli:main"
brainlens-mcp = "brainlens.mcp_server:main"
brainlens-workbench = "brainlens.cli:workbench_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brainlens = ["assets/*"]
